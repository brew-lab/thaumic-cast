<!doctype html>
<html lang="en" data-density="desktop">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thaumic Cast</title>
    <!--
      Early theme initialization to prevent flash of wrong theme.
      This runs synchronously before any content renders.

      IMPORTANT: The localStorage key 'thaumic-cast-theme' must match
      THEME_STORAGE_KEY in src/lib/theme.ts
    -->
    <script>
      (function () {
        var theme = localStorage.getItem('thaumic-cast-theme') || 'auto';
        // Only set the attribute, as applyTheme in @thaumic-cast/ui does. The
        // <style> block below and base.css map it to color-scheme; an inline
        // style would outrank them forever, freezing the scheme loaded first.
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <!-- The heading face (Geist 600), so the first heading does not swap faces. -->
    <link
      rel="preload"
      href="../../packages/ui/src/fonts/geist-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* The ground before the main CSS loads (the same values as --ground in tokens.css) */
      :root {
        color-scheme: light dark;
      }
      :root[data-theme='light'] {
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background-color: light-dark(oklch(94% 0.019 309.8), oklch(15.1% 0.022 302.3));
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
