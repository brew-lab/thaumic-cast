tray:
  # App info
  tooltip: Thaumic Cast
  app_name: Thaumic Cast
  version_line: '%{name} v%{version}'

  # Status line (dynamic)
  status_idle: Nothing casting
  status_streaming_one: 1 cast running
  status_streaming_many: '%{count} casts running'

  # Tooltip after "Stop all casts" ended a cast from another computer: the
  # first sentence, a space, then the second. The second counts casts, and
  # one other computer can own several, so it must not name a number of computers
  stop_all_stopped_one: '%{app}: stopped 1 cast.'
  stop_all_stopped_many: '%{app}: stopped %{count} casts.'
  stop_all_remote_one: '1 of them was not started on this computer.'
  stop_all_remote_many: '%{count} of them were not started on this computer.'

  # Menu items
  dashboard: Open Thaumic Cast
  launch_at_startup: Launch at login
  stop_all_streams: Stop all casts
  restart_server: Restart Thaumic Cast
  quit: Quit
