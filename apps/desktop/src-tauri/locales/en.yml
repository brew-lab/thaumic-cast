tray:
  # App info
  tooltip: Thaumic Cast
  app_name: Thaumic Cast
  version_line: '%{name} v%{version}'

  # Status line (dynamic)
  status_idle: No active rituals
  status_streaming_one: 1 active ritual
  status_streaming_many: '%{count} active rituals'

  # Tooltip after "Stop All Streams" ended a cast from another machine: the
  # first sentence, a space, then the second. The second counts streams, and
  # one other machine can own several, so it must not name a number of machines
  stop_all_stopped_one: '%{app} - stopped 1 stream.'
  stop_all_stopped_many: '%{app} - stopped %{count} streams.'
  stop_all_remote_one: '1 of them was not from this machine.'
  stop_all_remote_many: '%{count} of them were not from this machine.'

  # Menu items
  dashboard: Dashboard
  launch_at_startup: Launch at Startup
  stop_all_streams: Stop All Streams
  restart_server: Restart Server
  quit: Quit
