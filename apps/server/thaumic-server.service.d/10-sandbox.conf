# Filesystem sandboxing. These directives need mount namespaces, which an
# unprivileged LXC container without the nesting feature cannot create
# (the service would fail with status 226/NAMESPACE). install.sh skips this
# file on such hosts.
[Service]
ProtectSystem=strict
ProtectHome=true
PrivateTmp=true
ProtectKernelTunables=true
ProtectControlGroups=true
