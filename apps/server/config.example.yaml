# Thaumic Server Configuration
#
# Copy this file to config.yaml and adjust values for your environment.
# All settings can be overridden with environment variables.

# Port to bind the HTTP server to (default: 49400)
# Environment: THAUMIC_BIND_PORT
bind_port: 49400

# IP address to advertise to Sonos speakers.
# Leave unset to auto-detect the primary LAN IP (right for a host with one
# network interface). Set it explicitly on hosts with several interfaces
# (VPN, Docker, ...) to the address the speakers can reach.
# Environment: THAUMIC_ADVERTISE_IP
# advertise_ip: '192.168.1.100'

# Interval in seconds between topology refresh checks (default: 30)
# Environment: THAUMIC_TOPOLOGY_REFRESH_INTERVAL
topology_refresh_interval: 30

# Directory for persistent data (manual speakers, etc.)
# If not set, manual speaker configuration won't persist across restarts.
# Environment: THAUMIC_DATA_DIR
# data_dir: '/var/lib/thaumic-server'

# Custom artwork URL for Sonos album art display (optional)
# Should be an HTTPS URL for Android Sonos app compatibility.
# Precedence: artwork_url > data_dir/artwork.jpg > embedded default
# Environment: THAUMIC_ARTWORK_URL
# artwork_url: 'https://cdn.example.com/my-artwork.jpg'

# Refuse audio fetches from addresses a stream is not playing on (default: false)
# A stream id is not a secret: the server hands the stream URL to a Sonos
# speaker and the speaker republishes it to any device on the LAN that asks.
# Left false, an unexpected address is logged at warn and still served. Turn it
# on once your logs show no unexpected addresses — a wrongly refused fetch is
# silent dead air on the speaker, with nothing in the UI to explain it. Known
# case: a speaker whose address changes mid-cast (DHCP renewal, reboot) is
# refused until playback is restarted.
# It allows the addresses the control API has been told to play on, and that API
# is unauthenticated, so it stops a passive reader of the republished URL rather
# than someone actively driving the API.
# Environment: THAUMIC_STRICT_STREAM_ACCESS
# strict_stream_access: true

# Keep an eye on each speaker playing a stream (default: true)
# Every speaker that fetches a stream is asked for its playback position every
# two to three seconds (quiet SOAP calls, never more than 120 a minute in all),
# so a speaker that is about to run out of audio shows up in the log before it
# is heard. Grouped speakers and satellites that follow another speaker are
# never polled. Set to false to poll only casts that asked for video sync, as
# earlier releases did; video sync works either way. Applies from each
# speaker's next connection.
# Environment: THAUMIC_SPEAKER_MONITOR (on or off)
# speaker_monitor: false

# Send each speaker a burst of audio when it starts fetching a PCM stream (default: 500)
# Milliseconds of already-captured audio handed over at once, before real-time
# pacing takes over, so the speaker starts with that much in hand. Without it a
# speaker holds only a few tens of milliseconds ahead of its playhead, and a
# Wi-Fi stall longer than that is heard as a stutter. End-to-end latency grows
# by the same amount; video sync accounts for it. 0 turns it off; at most 2000.
# Compressed codecs are unaffected. Applies from each speaker's next connection.
# Environment: THAUMIC_PCM_CONNECT_BURST_MS
# pcm_connect_burst_ms: 500
