name: CI

permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts of the tree a change touches. Jobs below skip when their
  # inputs are untouched; a skipped job still satisfies the branch ruleset's
  # required checks, whereas a workflow-level path filter would leave them
  # pending forever. Lint is unconditional: it also checks Markdown and YAML.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ts: ${{ steps.filter.outputs.ts }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # No negated patterns here: a file matches a filter when it matches ANY
          # pattern, so a line like '!**/CHANGELOG.md' matches nearly every file
          # and turns the filter on for every change.
          filters: |
            rust:
              - 'packages/thaumic-core/**'
              - 'packages/thaumic-capture/**'
              - 'apps/server/src/**'
              - 'apps/server/Cargo.toml'
              - 'apps/desktop/src-tauri/**'
              - 'apps/wasapi-capture/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            ts:
              - 'apps/extension/**'
              - 'apps/desktop/src/**'
              - 'apps/desktop/index.html'
              - 'apps/desktop/package.json'
              - 'apps/desktop/tsconfig.json'
              - 'apps/desktop/vite.config.ts'
              - 'packages/protocol/**'
              - 'packages/shared/**'
              - 'packages/ui/**'
              - 'scripts/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              - '.github/workflows/ci.yml'
            # What the design-system catalogue draws: packages/ui and what it imports.
            ui:
              - 'packages/ui/**'
              - 'packages/protocol/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              - '.github/workflows/ci.yml'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run eslint .

      - name: Run Stylelint
        run: bun run stylelint '**/*.css'

      - name: Run the design-system check
        run: bun scripts/check-ds.ts

      - name: Check formatting
        run: bun run prettier --check .

  typecheck:
    name: Type Check
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run typecheck

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

  # The design-system catalogue (packages/ui/DESIGN.md §10 row 6): axe in both themes, the
  # behaviour tests and one screenshot per section, in Chromium and in WebKit. Each browser's
  # tests are split over shards that run at once; "Design System Catalogue" gathers them.
  # Screenshot baselines are made here only: a section with no baseline passes and writes its
  # picture to the catalogue-results artifact's new-baselines/ folder, to commit under
  # packages/ui/catalogue/tests/__screenshots__/<project>/. It always runs on main.
  catalogue-shard:
    name: Catalogue (${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit]
        shard: [1, 2, 3, 4]
        shards: [4]
    steps:
      - uses: actions/checkout@v4
        with:
          # The screenshot baselines are stored in Git LFS.
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright ${{ matrix.project }}
        working-directory: packages/ui
        run: bunx playwright install --with-deps ${{ matrix.project }}

      - name: Run axe, the behaviour tests and screenshots
        working-directory: packages/ui
        env:
          DS_SCREENSHOTS: '1'
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.project }}-${{ matrix.shard }}.zip
        run: >-
          bun run test:catalogue --project=${{ matrix.project }}
          --shard=${{ matrix.shard }}/${{ matrix.shards }}

      - name: Upload results and new baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-results-${{ matrix.project }}-${{ matrix.shard }}
          path: packages/ui/catalogue/test-results/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload the blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-blob-${{ matrix.project }}-${{ matrix.shard }}
          path: packages/ui/catalogue/blob-report/
          if-no-files-found: ignore
          retention-days: 1

  catalogue:
    name: Design System Catalogue
    needs: [changes, catalogue-shard]
    if: always() && (github.event_name == 'push' || needs.changes.outputs.ui == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Gather the shards' results and new baselines
        uses: actions/download-artifact@v4
        with:
          pattern: catalogue-results-*
          path: catalogue-results
          merge-multiple: true

      - name: Gather the shards' blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: catalogue-blob-*
          path: packages/ui/all-blob-reports
          merge-multiple: true

      - name: Merge the reports into one HTML report
        if: hashFiles('packages/ui/all-blob-reports/**') != ''
        working-directory: packages/ui
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: catalogue/playwright-report
        run: >-
          bunx playwright merge-reports --config catalogue/playwright.config.ts --reporter html
          ./all-blob-reports

      - name: Upload results and new baselines
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-results
          path: catalogue-results/
          if-no-files-found: ignore

      - name: Upload the HTML report
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-report
          path: packages/ui/catalogue/playwright-report/
          if-no-files-found: ignore

      - name: Fail unless every shard passed
        if: needs.catalogue-shard.result != 'success'
        run: |
          echo "A catalogue shard ended ${{ needs.catalogue-shard.result }}."
          exit 1

  rust-check:
    name: Rust Check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

  # The WASAPI capture crate only compiles on Windows, so the Linux job above
  # never sees it. A plain check is enough to catch a broken build.
  rust-check-windows:
    name: Rust Check (Windows capture)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-capture-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-capture-

      - name: Check the capture crate
        run: cargo check -p thaumic-capture --locked --all-targets

  build-extension:
    name: Build Extension
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build extension
        run: bun run --filter @thaumic-cast/extension build

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-build
          path: apps/extension/dist/
          retention-days: 7

  changeset-check:
    name: Changeset Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for changeset
        run: |
          # Check if there are any changesets in this PR
          CHANGESETS=$(find .changeset -name "*.md" ! -name "README.md" 2>/dev/null | wc -l)
          if [ "$CHANGESETS" -eq 0 ]; then
            echo "::warning::No changeset found. If this PR includes user-facing changes, please run 'bun run changeset' to create one."
          else
            echo "Found $CHANGESETS changeset(s)"
          fi
