version: 2
updates:
  # npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      dev-dependencies:
        dependency-type: 'development'
      production-dependencies:
        dependency-type: 'production'

  # Cargo dependencies
  - package-ecosystem: 'cargo'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      rust-dependencies:
        patterns:
          - '*'
    ignore:
      # The windows-rs crates move together: thaumic-capture's #[implement]
      # COM objects need windows-core to match windows, and windows-version
      # 0.100 brings a second windows-link. Drop these when a windows 0.100
      # is published.
      - dependency-name: 'windows-core'
        versions: ['>=0.100']
      - dependency-name: 'windows-version'
        versions: ['>=0.100']
