version: 2
updates:
  # npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      dev-dependencies:
        dependency-type: 'development'
      production-dependencies:
        dependency-type: 'production'

  # Cargo dependencies
  - package-ecosystem: 'cargo'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      rust-dependencies:
        patterns:
          - '*'
    ignore:
      # windows-core must match the windows crate's own: thaumic-capture's
      # #[implement] COM objects are built against both. Drop this when a
      # windows 0.100 is published.
      - dependency-name: 'windows-core'
        versions: ['>=0.100']
